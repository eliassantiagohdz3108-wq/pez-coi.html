<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peces betta</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    text-align: center; color: rgba(120, 255, 230, .6);
    font: 14px/1.4 Georgia, "Times New Roman", serif; letter-spacing: .02em;
    pointer-events: none; transition: opacity 1.5s ease;
  }
  #hint.off { opacity: 0; }
</style>
</head>
<body>
<div id="hint"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const COLOR = new THREE.Color(0.05, 1.0, 0.85); 
  const N = 24, SEG = 0.19;                       
  const MAX_SPEED = 3.0, TURN = 2.6;              

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  document.body.appendChild(renderer.domElement);
  let aspect = 1;
  function fit() {
    aspect = innerWidth / innerHeight;
    camera.aspect = aspect;
    camera.position.set(0, 9, 10.5).multiplyScalar(Math.max(1, 0.95 / aspect));
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  }
  fit();
  addEventListener('resize', fit);

  const rip = Array.from({ length: 24 }, () => new THREE.Vector4(0, 0, -99, 0));
  const shared = { uTime: { value: 0 }, uColor: { value: COLOR }, uRip: { value: rip } };
  const blend = { transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending };
 
  const water = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShaderMaterial({
    uniforms: shared, ...blend,
    vertexShader: `varying vec2 vXZ; void main(){ vXZ = vec2(position.x, -position.y); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform float uTime; uniform vec3 uColor; uniform vec4 uRip[24]; varying vec2 vXZ;
      void main(){
        float g = 0.0;
        for (int i = 0; i < 24; i++) {
          float age = uTime - uRip[i].z;
          if (age > 0.0 && age < 4.5) {
            float d = distance(vXZ, uRip[i].xy), rad = age * 2.4;
            g += (exp(-pow((d - rad) * 2.6, 2.0)) + 0.5 * exp(-pow((d - rad * 0.7) * 3.2, 2.0))) * exp(-age * 0.95) * uRip[i].w;
          }
        }
        g *= 0.45 * (1.0 - smoothstep(12.0, 28.0, length(vXZ)));
        gl_FragColor = vec4(uColor * g, g);
      }`
  }));
  water.rotation.x = -Math.PI / 2;
  scene.add(water);

  const GLSL = `
    uniform float uTime; uniform vec3 uColor; uniform vec3 uSp[${N}];
    vec3 sp(float t){ float f = clamp(t,0.0,1.0) * ${N - 1}.0; int i = int(floor(f)); int j = min(i+1, ${N - 1}); return mix(uSp[i], uSp[j], f - float(i)); }
    vec3 fwd(float t){ return normalize(sp(max(t-0.03,0.0)) - sp(min(t+0.03,1.0))); }
    vec3 sdv(vec3 T){ return normalize(cross(vec3(0.0,1.0,0.0), T)); }
    float prof(float t){ return pow(max(sin(3.14159 * pow(clamp(t/0.44,0.0,1.0), 0.7)), 0.0), 0.55); }
    float bw(float t){ return 0.2 * prof(t) + 0.012; }
    float bh(float t){ return 0.24 * prof(t) + 0.012; }`;
  const grid = (P, A, I, nu, nv, v0, v1, k) => {
    const o = A.length / 3;
    for (let i = 0; i <= nu; i++) for (let j = 0; j <= nv; j++) { P.push(0, 0, 0); A.push(i / nu, v0 + (v1 - v0) * j / nv, k); }
    for (let i = 0; i < nu; i++) for (let j = 0; j < nv; j++) {
      const a = o + i * (nv + 1) + j, b = a + nv + 1;
      I.push(a, b, a + 1, b, b + 1, a + 1);
    }
  };
  const mk = (uniforms, P, A, I, name, vs, fs) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
    g.setAttribute(name, new THREE.Float32BufferAttribute(A, 3));
    g.setIndex(I);
    const m = new THREE.Mesh(g, new THREE.ShaderMaterial({ uniforms, ...blend, vertexShader: GLSL + vs, fragmentShader: GLSL + fs }));
    m.frustumCulled = false;
    scene.add(m);
  };

  const COLOR2 = new THREE.Color(1.0, 0.42, 0.06); 
  function makeFish(color) {
    const uniforms = {
      uTime: shared.uTime, uRip: shared.uRip, uColor: { value: color },
      uSp: { value: Array.from({ length: N }, () => new THREE.Vector3()) }
    };
    { const P = [], A = [], I = [], nu = 40, nv = 16;
      for (let i = 0; i <= nu; i++) for (let j = 0; j <= nv; j++) { P.push(0, 0, 0); A.push(i / nu, j / nv * Math.PI * 2, 0); }
      for (let i = 0; i < nu; i++) for (let j = 0; j < nv; j++) { const a = i * (nv + 1) + j, b = a + nv + 1; I.push(a, b, a + 1, b, b + 1, a + 1); }
      mk(uniforms, P, A, I, 'aB', `
        attribute vec3 aB; varying vec3 vB, vN, vV;
        void main(){
          float t = aB.x * 0.44, a = aB.y, w = bw(t), h = bh(t);
          vec3 T = fwd(t), S = sdv(T), U = vec3(0.0,1.0,0.0);
          vec3 p = sp(t) + S * cos(a) * w + U * sin(a) * h;
          vN = normalize(S * cos(a) * h + U * sin(a) * w); vV = cameraPosition - p; vB = vec3(t, a, 0.0);
          gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
        }`, `
        varying vec3 vB, vN, vV;
        void main(){
          float fr = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.0);
          float sc = 0.5 + 0.5 * sin(vB.x * 110.0) * sin(vB.y * 9.0);
          float ang = min(abs(vB.y - 0.4), abs(vB.y - 2.74));
          float d = length(vec2((vB.x - 0.07) * 4.0, ang * 0.9));
          float eye = smoothstep(0.02, 0.04, d) * (1.0 - smoothstep(0.05, 0.075, d));
          vec3 c = mix(uColor, vec3(0.9, 1.0, 1.0), fr * 0.7);
          float a = 0.2 + fr * 0.9 + 0.1 * sc;
          gl_FragColor = vec4(c + eye, a + eye);
        }`);
    }

    { const P = [], A = [], I = [];
      grid(P, A, I, 28, 14, -1, 1, 0);
      grid(P, A, I, 10, 3, 0, 1, 1);
      grid(P, A, I, 10, 3, 0, 1, 2);
      mk(uniforms, P, A, I, 'aV', `
        attribute vec3 aV; varying vec3 vVv;
        void main(){
          float u = aV.x, v = aV.y, k = aV.z, t;
          vec3 U = vec3(0.0,1.0,0.0), p;
          if (k < 0.5) {
            t = mix(0.36, 1.0, u);
            vec3 T = fwd(t), S = sdv(T);
            float h = 0.05 + 0.95 * pow(u, 0.65) * (1.0 - 0.3 * u * u);
            h *= 1.0 + 0.09 * sin(v * 9.0 + uTime * 2.0 - u * 6.0) * u;
            p = sp(t) + U * v * h * 0.9 + T * v * v * 0.45 * u
              + S * sin(uTime * 2.5 - u * 7.0 + v * 2.0) * 0.12 * u * (0.4 + abs(v));
          } else if (k < 1.5) {
            t = mix(0.16, 0.4, u);
            vec3 T = fwd(t), S = sdv(T);
            float hh = 0.4 * pow(sin(3.14159 * u), 0.8);
            p = sp(t) + U * (bh(t) + v * hh) - T * v * 0.25 + S * sin(uTime * 3.0 - u * 5.0) * 0.05 * v;
          } else {
            t = mix(0.24, 0.46, u);
            vec3 T = fwd(t), S = sdv(T);
            float hh = 0.55 * pow(sin(3.14159 * u), 0.7) + 0.1 * u;
            p = sp(t) - U * (bh(t) * 0.8 + v * hh) - T * v * 0.35 + S * sin(uTime * 2.8 - u * 5.0) * 0.08 * v;
          }
          vVv = aV;
          gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
        }`, `
        varying vec3 vVv;
        void main(){
          float u = vVv.x, v = vVv.y, a;
          float rays = 0.5 + 0.5 * sin((vVv.z < 0.5 ? v * 36.0 : u * 40.0));
          if (vVv.z < 0.5) {
            a = (0.12 + 0.32 * rays) * smoothstep(0.0, 0.1, u) * (1.0 - 0.5 * abs(v)) + smoothstep(0.82, 1.0, u) * 0.3 * (0.5 + 0.5 * rays);
          } else {
            a = 0.04 + 0.4 * (1.0 - v) * (0.4 + 0.6 * rays) * sqrt(max(sin(3.14159 * u), 0.0));
          }
          gl_FragColor = vec4(mix(uColor, vec3(0.9, 1.0, 1.0), 0.35 * rays), a);
        }`);
    }

    { const P = [], A = [], I = [];
      for (const s of [-1, 1]) {
        const o = A.length / 3;
        for (let i = 0; i <= 8; i++) for (let v = 0; v <= 1; v++) { P.push(0, 0, 0); A.push(i / 8, v, s); }
        for (let i = 0; i < 8; i++) { const a = o + i * 2; I.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
      }
      mk(uniforms, P, A, I, 'aF', `
        attribute vec3 aF; varying vec2 vF;
        void main(){
          vec3 P = sp(0.13), T = fwd(0.13), S = sdv(T);
          float fl = sin(uTime * 2.2 + aF.z) * 0.35;
          vec3 p = P + S * aF.z * (bw(0.13) + aF.x * 0.45 * cos(fl)) - T * (aF.y * 0.22 + aF.x * 0.4);
          p.y += -0.08 + aF.x * 0.12 * sin(fl * 2.0);
          vF = aF.xy;
          gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
        }`, `
        varying vec2 vF;
        void main(){
          float rays = 0.5 + 0.5 * sin(vF.y * 30.0);
          gl_FragColor = vec4(mix(uColor, vec3(0.9, 1.0, 1.0), 0.3), (1.0 - vF.x) * (0.15 + 0.3 * rays));
        }`);
    }

    return uniforms;
  }

  function makeState(color, x, z, th, dir, off) {
    return {
      U: makeFish(color), theta: th, speed: 1, phase: off * 3, dir, off, nextRip: 0,
      chain: Array.from({ length: N }, (_, i) => new THREE.Vector3(x - Math.cos(th) * i * SEG, 0.25, z - Math.sin(th) * i * SEG))
    };
  }
  const fishes = [makeState(COLOR, -3, 0, 0, 1, 0), makeState(COLOR2, 3, 2.5, Math.PI, -1, 1.7)];
  const target = new THREE.Vector3(0, 0.25, 0), wander = new THREE.Vector3(0, 0.25, 0);
  let T = 0, lastTouch = -99, down = false, lastRipT = 0;
  const lastRip = new THREE.Vector2(1e9, 1e9);
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ripple = (() => { let k = 0; return (x, z, a) => { rip[k].set(x, z, T, a); k = (k + 1) % 24; }; })();

  function aim(e, tap) {
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const o = ray.ray.origin, d = ray.ray.direction;
    if (d.y > -0.01) return;
    const t = -o.y / d.y, x = o.x + d.x * t, z = o.z + d.z * t; 
    target.set(x, 0.25, z);
    lastTouch = T;
    if (tap) { ripple(x, z, 1); lastRip.set(x, z); lastRipT = T; }
    else if (T - lastRipT > 0.04 && Math.hypot(x - lastRip.x, z - lastRip.y) > 0.35) {
      ripple(x, z, 0.5); 
      lastRip.set(x, z); lastRipT = T;
    }
  }
  const el = renderer.domElement;
  el.addEventListener('pointerdown', e => {
    down = true; el.setPointerCapture(e.pointerId); aim(e, true);
    document.getElementById('hint').classList.add('off');
  });
  el.addEventListener('pointermove', e => { if (down || e.pointerType === 'mouse') aim(e, false); });
  const up = () => { down = false; };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);

  function step(dt) {
    T += dt;
    shared.uTime.value = T;
    const touching = T - lastTouch < 6;
    fishes.forEach((f, idx) => {
      const head = f.chain[0], oh = fishes[1 - idx].chain[0], orbit = idx ? 2.0 : 1.5;
      wander.set(Math.sin(T * (0.31 - 0.07 * idx) + f.off) * 6.5 * Math.min(1, aspect * 1.6), 0.25,
                 Math.cos(T * (0.23 + 0.05 * idx) + f.off * 1.3) * 4.5 + 0.5);
      const tg = touching ? target : wander;
      const dx = tg.x - head.x, dz = tg.z - head.z, dist = Math.hypot(dx, dz);
      let want = Math.atan2(dz, dx);
      if (dist < orbit) want += 1.1 * f.dir;                       
      const sx = head.x - oh.x, sz = head.z - oh.z;
      if (Math.hypot(sx, sz) < 1.4) want = Math.atan2(sz, sx);     
      let diff = want - f.theta; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      f.theta += clamp(diff, -TURN * dt, TURN * dt);
      f.speed += ((dist < orbit ? 0.7 : Math.min(MAX_SPEED * (1 - 0.12 * idx), 0.9 + dist * 0.55)) - f.speed) * Math.min(1, dt * 2);
      head.x += Math.cos(f.theta) * f.speed * dt;
      head.z += Math.sin(f.theta) * f.speed * dt;
      for (let i = 1; i < N; i++) {
        const a = f.chain[i - 1], b = f.chain[i];
        const vx = b.x - a.x, vz = b.z - a.z, l = Math.hypot(vx, vz) || 1;
        b.x = a.x + vx / l * SEG; b.z = a.z + vz / l * SEG;
      } /* <-- Se eliminó el punto y coma erróneo de aquí */
      f.phase += dt * (2.6 + f.speed * 1.6);
      const amp = 0.08 + f.speed * 0.04, out = f.U.uSp.value;
      for (let i = 0; i < N; i++) {
        const a = f.chain[Math.max(i - 1, 0)], b = f.chain[Math.min(i + 1, N - 1)];
        const tx = a.x - b.x, tz = a.z - b.z, l = Math.hypot(tx, tz) || 1;
        const fr = i / (N - 1), w = Math.sin(f.phase - i * 0.45) * amp * (0.2 + fr * 1.2);
        out[i].set(f.chain[i].x - tz / l * w, 0.25 + Math.sin(f.phase * 0.5 - i * 0.3) * 0.03, f.chain[i].z + tx / l * w);
      }
      if (f.speed > 1.5 && T > f.nextRip) { ripple(head.x, head.z, 0.3); f.nextRip = T + 0.9; }
    });
  }
  
  let last = performance.now();
  renderer.setAnimationLoop(now => {
    step(Math.min((now - last) / 1000, 0.05));
    last = now;
    renderer.render(scene, camera);
  });
})();
</script>
</body>
</html>
